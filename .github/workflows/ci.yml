# ---------------------------------------------------------------------------
# Intégration continue de velocite-ops.
#
# Un job "images" pour l'image du job batch : construction, analyse de
# vulnérabilités (bloquante sur HIGH et CRITICAL corrigeables), contrôle
# de l'utilisateur. Correction de l'atelier 2.
#
# Règles de la chaîne, non négociables :
#   - droits minimaux (permissions: contents: read) ;
#   - actions tierces pinnées par SHA de commit, jamais par tag : en
#     mars 2026, les tags de trivy-action ont été déplacés vers du code
#     malveillant ;
#   - outils installés par scripts/ci/outils.sh (versions et sha256
#     figés).
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  images:
    name: Image batch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Outils
        run: bash scripts/ci/outils.sh trivy

      - name: Construction
        run: docker build -t velocite/batch:ci app/services/batch

      # Politique : on bloque sur toute vulnérabilité HIGH ou CRITICAL qui a
      # un correctif publié. Celles sans correctif sont listées, pas
      # bloquantes (app/SECURITE.md, "Ce qui reste ouvert").
      - name: Vulnérabilités corrigeables (bloquant)
        run: >
          trivy image --quiet
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          velocite/batch:ci

      - name: Vulnérabilités sans correctif (pour information)
        run: >
          trivy image --quiet --skip-db-update --severity HIGH,CRITICAL
          --format table velocite/batch:ci

      - name: Le conteneur ne tourne pas en root
        run: |
          u=$(docker image inspect --format '{{.Config.User}}' velocite/batch:ci)
          echo "utilisateur : ${u:-root}"
          test "$u" = "10001:10001"
