# Environnement de développement : une réplique de chaque service, frontal
# sur https://localhost:8443.
#   kubectl apply -k deploy/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velocite-dev

resources:
  - ../../base

labels:
  - pairs:
      velocite.fr/env: dev
    includeSelectors: false

images:
  - name: velocite/api
    newTag: 2.2.0

patches:
  - path: frontal.yaml
  - path: api.yaml
