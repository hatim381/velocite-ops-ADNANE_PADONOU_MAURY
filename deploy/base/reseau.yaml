# Flux réseau autorisés. Le namespace est fermé par défaut, en entrée comme
# en sortie (NetworkPolicy "tout-refuser", créée par OpenTofu avec le
# namespace). Chaque politique ci-dessous ouvre un flux nommé, rien
# d'autre. Lire ce fichier, c'est lire la matrice des flux de la plateforme.
#
#   poste -> nginx -> api ----> postgres, redis, garage
#                  -> ingest -> postgres
#   loadgen -> nginx
#   initialisation -> garage, postgres
#   batch (Argo) -> postgres, garage, Pushgateway, API Kubernetes
#   Prometheus (namespace observabilite) -> métriques 9100
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nginx}
  policyTypes: [Ingress, Egress]
  ingress:
    # Le trafic du poste arrive par le port de noeud : sa source n'est pas
    # un pod, on ne peut pas la restreindre davantage.
    - ports:
        - {port: 8443, protocol: TCP}
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
      ports:
        - {port: 8080, protocol: TCP}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ingest}}
      ports:
        - {port: 8081, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - {port: 8080, protocol: TCP}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observabilite}}
      ports:
        - {port: 9100, protocol: TCP}
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
      ports:
        - {port: 6379, protocol: TCP}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: garage}}
      ports:
        - {port: 3900, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
      ports:
        - {port: 6379, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: garage}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: batch}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: initialisation}}
      ports:
        - {port: 3900, protocol: TCP}
    # L'API d'administration (clés, buckets) : l'initialisation seulement.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: initialisation}}
      ports:
        - {port: 3903, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: initialisation
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: initialisation}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: garage}}
      ports:
        - {port: 3900, protocol: TCP}
        - {port: 3903, protocol: TCP}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ingest}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - {port: 8081, protocol: TCP}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observabilite}}
      ports:
        - {port: 9100, protocol: TCP}
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loadgen
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loadgen}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observabilite}}
      ports:
        - {port: 9100, protocol: TCP}
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - {port: 8443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: ingest}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: initialisation}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: batch}}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: batch}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: garage}}
      ports:
        - {port: 3900, protocol: TCP}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observabilite}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus-pushgateway}}
      ports:
        - {port: 9091, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
