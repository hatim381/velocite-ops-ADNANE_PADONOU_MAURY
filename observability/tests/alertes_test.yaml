# Tests unitaires des règles : des séries inventées, minute par minute, et
# les alertes attendues à un instant donné.
#   promtool test rules observability/tests/alertes_test.yaml
#
# Correction de l'atelier 8 : un test par alerte ajoutée, chacun prouve
# qu'elle part quand il faut, et qu'elle ne part pas sinon.

rule_files:
  - ../regles/enregistrement.yaml
  - ../regles/alertes.yaml

evaluation_interval: 30s

tests:
  - name: plus aucun pod prêt
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="velocite-dev", deployment="api"}'
        values: '1x3 0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: VelociteSansReplicaPret
        exp_alerts: []
      - eval_time: 7m
        alertname: VelociteSansReplicaPret
        exp_alerts:
          - exp_labels:
              severity: critique
              namespace: velocite-dev
              deployment: api
            exp_annotations:
              summary: "api n'a plus aucun pod prêt dans velocite-dev"
              description: "kubectl -n velocite-dev get pods ; kubectl -n velocite-dev describe deploy/api"
              runbook: docs/RUNBOOK.md#service-indisponible

  - name: bilan en échec (alerte fournie)
    interval: 1m
    input_series:
      - series: 'velocite_bilan_dernier_statut{env="prod", job="velocite_bilan", groupe="execution"}'
        values: '1x5 0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: BilanEchoue
        exp_alerts: []
      - eval_time: 8m
        alertname: BilanEchoue
        exp_alerts:
          - exp_labels:
              severity: critique
              env: prod
              job: velocite_bilan
              groupe: execution
            exp_annotations:
              summary: "Le dernier bilan quotidien de prod a échoué"
              description: "argo -n velocite-prod list ; puis argo logs du workflow en échec. Code 2 : donnée invalide, ne pas relancer à l'aveugle."
              runbook: docs/RUNBOOK.md#reprise-du-bilan

  - name: mise à jour bloquée (alerte fournie)
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_condition{namespace="velocite-prod", deployment="api", condition="Progressing", status="false"}'
        values: '0x3 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: MiseAJourBloquee
        exp_alerts: []
      - eval_time: 6m
        alertname: MiseAJourBloquee
        exp_alerts:
          - exp_labels:
              severity: critique
              namespace: velocite-prod
              deployment: api
              condition: Progressing
              status: "false"
            exp_annotations:
              summary: "La mise à jour de api n'avance plus dans velocite-prod"
              description: "Les nouveaux pods ne deviennent pas prêts. Les anciens servent toujours. Lire les logs du nouveau pod, puis décider : corriger ou revenir en arrière."
              runbook: docs/RUNBOOK.md#retour-arriere

  # La route /api/login : 60 appels réussis par minute, puis, à partir de
  # la 6e minute, 30 échecs par minute (33 % d'erreurs).
  - name: disponibilité par route sous l'objectif
    interval: 1m
    input_series:
      - series: 'velocite_client_requests_total{namespace="velocite-dev", route="/api/login", code="200"}'
        values: '0+60x20'
      - series: 'velocite_client_requests_total{namespace="velocite-dev", route="/api/login", code="erreur"}'
        values: '0x5 30+30x14'
      - series: 'velocite_client_requests_total{namespace="velocite-dev", route="/ingest/telemetry/batch", code="200"}'
        values: '0+600x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: DisponibiliteSousObjectif
        exp_alerts: []
      - eval_time: 12m
        alertname: DisponibiliteSousObjectif
        exp_alerts:
          - exp_labels:
              severity: critique
              namespace: velocite-dev
              route: /api/login
            exp_annotations:
              summary: "velocite-dev : plus de 1 % d'échecs sur /api/login, vus par le client témoin"
              description: "Le tableau de bord VéloCité, panneau disponibilité ; puis kubectl -n velocite-dev get pods et les logs du frontal."
              runbook: docs/RUNBOOK.md#service-indisponible

  # 200 lignes par minute : 2000 en 10 min, sous le seuil ; puis une salve de
  # 1000 lignes par minute : plus de 5000 en 10 min.
  - name: salve d'extraction data science
    interval: 1m
    input_series:
      - series: 'velocite_rows_exported_total{namespace="velocite-prod", role="datascientist"}'
        values: '0+200x10 2000+1000x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExtractionMassive
        exp_alerts: []
      - eval_time: 20m
        alertname: ExtractionMassive
        exp_alerts:
          - exp_labels:
              severity: avertissement
              namespace: velocite-prod
              role: datascientist
            exp_annotations:
              summary: "Plus de 5000 lignes exportées en 10 min par le rôle datascientist (velocite-prod)"
              description: "L'export est autorisé, son volume ne l'est pas forcément. Qui, quand, pour quoi : vérifier avec l'équipe data avant de conclure."
              runbook: docs/RUNBOOK.md#extraction-massive
