apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: bilan-quotidien
spec:
  # Argo 4 attend une liste, même pour un seul calendrier.
  schedules: ["30 2 * * *"]
  timezone: "Europe/Paris"
  concurrencyPolicy: Forbid
  # Un cluster arrêté ne rattrape le lancement que pendant une heure.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  workflowSpec:
    workflowTemplateRef:
      name: bilan-quotidien
