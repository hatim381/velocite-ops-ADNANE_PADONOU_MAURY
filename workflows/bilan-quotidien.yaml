# ---------------------------------------------------------------------------
# Le bilan quotidien des trajets, en Argo Workflows.
#
#   extract -> check -> aggregate -> publish        puis, toujours : signaler
#
# Chaque étape est un pod de l'image velocite/batch. Le cron de la v1 lançait
# les quatre commandes à la suite et ne savait rien de leurs échecs.
#
# Ce que ce fichier décide, et que le cron de la v1 ne savait pas faire
# (correction de l'atelier 7) :
#   1. l'ordre des étapes, et l'arrêt au premier échec : un DAG ;
#   2. la relance automatique, seulement quand elle a un sens (code 75 :
#      panne temporaire), avec un délai qui double à chaque essai ;
#   3. jamais deux bilans en même temps dans un namespace : un mutex ;
#   4. l'issue publiée pour la supervision, succès comme échec : onExit ;
#   5. une durée maximale : un bilan bloqué finit par échouer, et se voit.
#
# Lancer à la main, pour une date donnée :
#   argo -n velocite-dev submit --from workflowtemplate/bilan-quotidien -p date=2026-03-12 --watch
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bilan-quotidien
spec:
  entrypoint: bilan
  serviceAccountName: bilan
  # 4. Toujours exécuté, réussite ou échec : dépose l'issue du bilan.
  onExit: signaler
  # 5. Au-delà d'une heure, le bilan est arrêté en échec (et onExit le dit).
  activeDeadlineSeconds: 3600
  # 3. Un bilan relancé à la main attend celui de la nuit.
  synchronization:
    mutexes:
      - name: bilan-quotidien
  # Le jeton Kubernetes ne va qu'aux conteneurs d'Argo (init, wait), pas au
  # code du batch, qui n'en a pas l'usage. Sans cela, Kubernetes le
  # monterait dans /run/secrets/kubernetes.io, à l'intérieur du volume des
  # secrets, en lecture seule : le conteneur ne démarrerait pas.
  automountServiceAccountToken: false
  executor:
    serviceAccountName: bilan

  arguments:
    parameters:
      - name: date
        value: ""            # vide : la veille, calculée par le job (UTC)
        description: "Jour à traiter, AAAA-MM-JJ"

  # L'étiquette qui donne aux pods leurs droits réseau (deploy/base/reseau.yaml).
  podMetadata:
    labels:
      app.kubernetes.io/name: batch

  # Les pods réussis disparaissent ; ceux en échec restent pour l'enquête.
  podGC:
    strategy: OnPodSuccess
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 604800

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: {type: RuntimeDefault}

  volumes:
    - name: tmp
      emptyDir: {sizeLimit: 128Mi}
    - name: secrets
      projected:
        defaultMode: 0440
        sources:
          - secret:
              name: velocite-db
              items:
                - {key: database_url_batch, path: database_url_batch}
          - secret:
              name: velocite-garage
              items:
                - {key: s3_batch_key_id, path: s3_batch_key_id}
                - {key: s3_batch_secret, path: s3_batch_secret}
          - secret:
              name: velocite-app
              items:
                - {key: pseudo_key, path: pseudo_key}
          - configMap:
              name: velocite-ca
              items:
                - {key: ca.crt, path: ca.crt}

  templates:
    - name: bilan
      # 1. Quatre tâches en chaîne : chacune attend que la précédente ait
      # réussi ; un échec arrête la suite.
      dag:
        tasks:
          - name: extract
            template: etape
            arguments:
              parameters: [{name: commande, value: extract}]
          - name: check
            depends: extract
            template: etape
            arguments:
              parameters: [{name: commande, value: check}]
          - name: aggregate
            depends: check
            template: etape
            arguments:
              parameters: [{name: commande, value: aggregate}]
          - name: publish
            depends: aggregate
            template: etape
            arguments:
              parameters: [{name: commande, value: publish}]

    # Une étape du job.
    - name: etape
      inputs:
        parameters:
          - name: commande
      # 2. Le code de sortie décide de la suite :
      #   75 panne temporaire : relance, jusqu'à 3 fois (30 s, 1 min, 2 min) ;
      #   2 donnée invalide, 78 configuration : arrêt immédiat, relancer
      #   produirait le même résultat. Il faut un humain (RUNBOOK).
      retryStrategy:
        limit: "3"
        retryPolicy: OnFailure
        expression: "asInt(lastRetry.exitCode) == 75"
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "10m"
      container:
        image: velocite/batch:1.0.0
        imagePullPolicy: IfNotPresent
        # La commande est explicite : l'exécuteur d'Argo ne sait pas lire le
        # point d'entrée d'une image chargée dans kind sans registre.
        command: [python, /app/batch.py]
        args: ["{{inputs.parameters.commande}}", "--date", "{{workflow.parameters.date}}"]
        env:
          - {name: DATABASE_URL_FILE, value: /run/secrets/database_url_batch}
          - {name: S3_ENDPOINT, value: "http://garage:3900"}
          - {name: S3_ACCESS_KEY_FILE, value: /run/secrets/s3_batch_key_id}
          - {name: S3_SECRET_KEY_FILE, value: /run/secrets/s3_batch_secret}
          - {name: PSEUDO_KEY_FILE, value: /run/secrets/pseudo_key}
          - {name: WORKFLOW_NAME, value: "{{workflow.name}}"}
          # Injecteur de pannes temporaires, pour l'exercice sur les reprises.
          - {name: BATCH_FAIL_RATE, value: "0"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts:
          - {name: secrets, mountPath: /run/secrets, readOnly: true}
          - {name: tmp, mountPath: /tmp}

    # Exécuté à la fin, quoi qu'il arrive : dépose l'issue du bilan dans la
    # Pushgateway, où les alertes BilanEchoue et BilanEnRetard la lisent.
    - name: signaler
      container:
        image: velocite/batch:1.0.0
        imagePullPolicy: IfNotPresent
        command: [python, /app/batch.py]
        args: [signaler, --statut, "{{workflow.status}}"]
        env:
          - name: PUSHGATEWAY_URL
            value: "http://prometheus-prometheus-pushgateway.observabilite.svc:9091"
          - name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
